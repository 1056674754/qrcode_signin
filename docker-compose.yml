# 扫码签到：PocketBase + 静态前端 + nginx 反向代理
# 用法：
#   cp .env.docker.example .env   # 按需修改
#   docker compose up -d --build
# 访问：统一入口 http://localhost:NGINX_PORT ，Admin http://localhost:NGINX_PORT/_/
# OAuth2 由 pb_hooks/oauth2.pb.js 从环境变量自动配置；首次需在 Admin 中建表（见 docs/COLLECTIONS.md）

name: qrcode-signin

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: qrcode-signin-pocketbase
    restart: unless-stopped
    # 不对外暴露，仅通过 nginx 代理
    expose:
      - 8090
    environment:
      PB_HOST: 0.0.0.0
      PB_PORT: 8090
      # 可选：首次启动自动创建/更新 superuser（生产务必改强密码）
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      # OAuth2：端点须在 .env 中配置，无镜像内默认域名（见 docs/OIDC-PROVIDER.md）
      PB_OAUTH2_PROVIDER_NAME: ${PB_OAUTH2_PROVIDER_NAME:-oidc}
      PB_OAUTH2_DISPLAY_NAME: ${PB_OAUTH2_DISPLAY_NAME:-OAuth}
      PB_OAUTH2_CLIENT_ID: ${PB_OAUTH2_CLIENT_ID:-}
      PB_OAUTH2_CLIENT_SECRET: ${PB_OAUTH2_CLIENT_SECRET:-}
      PB_OAUTH2_AUTH_URL: ${PB_OAUTH2_AUTH_URL:-}
      PB_OAUTH2_TOKEN_URL: ${PB_OAUTH2_TOKEN_URL:-}
      PB_OAUTH2_USER_URL: ${PB_OAUTH2_USER_URL:-}
      PB_OAUTH2_SCOPE: ${PB_OAUTH2_SCOPE:-read email profile openid}
    volumes:
      # 数据持久化到项目目录（已在 .gitignore）
      - ./pb_data:/pb_data
      # 与仓库根目录 pb_hooks 对齐（muchobien 镜像默认 --hooksDir=/pb_hooks）
      - ./pb_hooks:/pb_hooks
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8090/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 生产环境：空字符串或 '/' = 同源（nginx 代理），开发：http://localhost:8090
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
        VITE_OAUTH_PROVIDER: ${VITE_OAUTH_PROVIDER:-oidc}
    container_name: qrcode-signin-web
    restart: unless-stopped
    # 内部暴露，由 nginx 代理
    expose:
      - 80
    depends_on:
      pocketbase:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: qrcode-signin-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - pocketbase
